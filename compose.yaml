services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: avc
    ports: ["54329:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avc"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["63799:6379"]
  gcs:
    image: fsouza/fake-gcs-server:1.52.2
    # objects persist in ./.data/gcs; the bucket directory is created on every start so a fresh clone works
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /storage/${GCS_BUCKET:-avc-local} &&
        exec /bin/fake-gcs-server -backend filesystem -filesystem-root /storage
        -scheme http -port 4443 -external-url http://localhost:4443 -public-host localhost:4443
    volumes: ["./.data/gcs:/storage"]
    ports: ["4443:4443"]
  # A second long-running relay would double-process runs, so this stays off `docker compose up`.
  worker:
    profiles: ["media"]
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    volumes:
      - ./backend:/app
      - worker-venv:/app/.venv # the image syncs its own env; do not replace backend/.venv on the Mac
    working_dir: /app
    # Shares fake-gcs's netns: its resumable session URLs advertise localhost:4443, which must
    # stay the browser-facing host, so the worker must see that same loopback.
    network_mode: "service:gcs"
    command: uv run python -m app.pipeline.worker
    depends_on: [postgres, gcs]
    environment:
      DATABASE_URL_WORKER: postgresql://app_worker:app_worker_dev@host.docker.internal:54329/avc
      DATABASE_URL_RELAY: postgresql://app_relay:app_relay_dev@host.docker.internal:54329/avc
      DATABASE_URL_API: postgresql://app_api:app_api_dev@host.docker.internal:54329/avc
      STORAGE_EMULATOR_HOST: http://localhost:4443
      GCS_BUCKET: avc-local
      REDIS_URL: redis://host.docker.internal:63799/0
      JWT_SECRET: local-dev-only-secret-change-me-0123456789
      FRONTEND_BASE_URL: http://localhost:3000

volumes:
  worker-venv:
