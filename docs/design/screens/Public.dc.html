<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public share page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0A0A0A}a:hover{color:#3A3A3A}
h1,h2{font-family:"Bricolage Grotesque",Geist,sans-serif;font-weight:500!important;letter-spacing:-0.025em!important}
</style>
</helmet>
<div style="font-family: Geist, system-ui, sans-serif; color: #0A0A0A; background: #FFFFFF; min-height: 900px">
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid #F3F3F3">
    <span style="font-size: 15px; font-weight: 600">Northwind</span>
    <a href="Main.dc.html" style="font-size: 14px; color: #3A3A3A; text-decoration: none">Record your own</a>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px; box-sizing: border-box; display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start">
    <section style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="aspect-ratio: 16 / 9; background: #1F2430; border-radius: 20px; position: relative; overflow: hidden">
        <div style="position: absolute; inset: 28px; background: #F4F4F2; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
          <span style="height: 14px; width: 26%; background: #DCDCDC; border-radius: 4px"></span>
          <span style="height: 10px; width: 70%; background: #EAEAEA; border-radius: 4px"></span>
          <span style="height: 10px; width: 64%; background: #EAEAEA; border-radius: 4px"></span>
          <span style="height: 40px; width: 140px; background: #0A0A0A; border-radius: 6px; margin-top: 12px"></span>
        </div>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; align-items: center; gap: 14px; color: #FFFFFF; background: linear-gradient(transparent, rgba(10,10,10,0.75))">
          <button aria-label="Pause" style="width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,0.18); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
          </button>
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px">0:41 / 1:52</span>
          <span style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative">
            <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 37%; background: #FFFFFF; border-radius: 2px"></span>
          </span>
          <span style="font-size: 12px; font-weight: 500; padding: 3px 7px; border: 1px solid rgba(255,255,255,0.5); border-radius: 5px">1x</span>
          <span style="font-size: 12px; font-weight: 500; padding: 3px 7px; border: 1px solid rgba(255,255,255,0.5); border-radius: 5px">CC</span>
        </div>
      </div>
      <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em">Exporting invoices to CSV</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #E9E4F5; color: #3D2F73; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">MO</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">Maya Okafor</span>
          <span style="font-size: 13px; color: #5C5C5C">Oct 18, 2026</span>
        </div>
      </div>
    </section>

    <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Steps</h2>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
          <li>
            <button onClick="{{s.pick}}" style="width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 12px 14px; background: {{s.bg}}; font: inherit; color: #0A0A0A; display: flex; gap: 14px; cursor: pointer">
              <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5C5C5C; padding-top: 2px; width: 34px; flex: none">{{s.t}}</span>
              <span style="font-size: 14px; line-height: 1.45; font-weight: {{s.weight}}">{{s.label}}</span>
            </button>
          </li>
        </sc-for>
      </ol>
      <div style="margin-top: 12px; border-top: 1px solid #F3F3F3; padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Transcript</h2>
        <p style="margin: 0; font-size: 14px; color: #3A3A3A; line-height: 1.6">In Billing, open Invoices from the menu on the left. Filter by Paid, then set the date range to last quarter. Select all, then choose Export.</p>
      </div>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { at: 2 };
}
renderVals() {
const steps = [
['0:00', 'Open Invoices'],
['0:09', 'Filter by Paid and last quarter'],
['0:31', 'Select all and export'],
['1:14', 'Pick CSV'],
['1:27', 'Check the totals']
].map(([t, label], i) => ({
t, label,
bg: i === this.state.at ? '#F1EEFB' : 'transparent',
weight: i === this.state.at ? '500' : '400',
pick: () => this.setState({ at: i })
}));
return { steps };
}
}
</script>
</body>
</html>
